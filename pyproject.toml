[project]
name = "enigma-lab"
version = "0.1.0"
description = "Enigma Lab: simulación y criptoanálisis estadístico de Enigma y la Bombe de Turing-Welchman"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Carlos Daniel Guarin Ortiz" }]
dependencies = [
    "numpy>=2.0",
    "numba>=0.60",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "pandas>=2.2",
    "pyarrow>=17",
    "streamlit>=1.45",
    "plotly>=5.24",
    "matplotlib>=3.9",
    "networkx>=3.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "py-enigma>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enigma_lab"]

# ---------------------------------------------------------------- calidad

[tool.ruff]
line-length = 100
target-version = "py312"
# app/ui se importa como «ui» (Streamlit pone app/ en sys.path).
src = ["src", "app", "tests"]
# El piloto se conserva tal como lo escribió el autor (referencia histórica).
extend-exclude = ["scripts/piloto_enigma.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "NPY", "RUF"]
# RUF001-003: los textos en español usan a propósito ×, −, ≈ y comillas «».
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["enigma_lab"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "lento: pruebas largas; se omiten con  pytest -m 'not lento'",
]
