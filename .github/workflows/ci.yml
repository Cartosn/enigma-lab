name: CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    name: Pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar Python 3.12 y las dependencias de uv.lock
        run: uv sync --locked

      - name: Estilo (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tipos (mypy)
        run: uv run mypy

      - name: Pruebas
        run: uv run pytest
